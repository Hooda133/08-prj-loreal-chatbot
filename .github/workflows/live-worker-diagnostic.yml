name: Verify latest Beauty Concierge layout
on:
  push:
    branches:
      - fix/live-worker-production-diagnosis
    paths:
      - .github/workflows/live-worker-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-large-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out extra-large chat PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/extra-large-beauty-concierge
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chrome automation
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Start preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/large-chat-preview.log 2>&1 &
          sleep 2
      - name: Test real desktop and mobile layout
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node tests/browser-smoke.mjs
      - name: Test chatbot behavior
        run: node --test tests/chatbot-flow.test.mjs tests/routine-builder.test.mjs
      - name: Upload visible reply screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-large-chat-browser-proof
          path: |
            /tmp/beauty-chat-reply-visible.png
            /tmp/final-beauty-desktop.png
            /tmp/final-beauty-mobile.png
          if-no-files-found: ignore
