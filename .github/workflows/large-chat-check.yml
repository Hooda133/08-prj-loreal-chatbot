name: Verify extra-large Beauty Concierge
on:
  push:
    branches:
      - fix/extra-large-beauty-concierge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser automation
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Start local website
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/atelier-chat-size.log 2>&1 &
          sleep 2
      - name: Verify desktop and mobile large chat
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node tests/browser-smoke.mjs
      - name: Upload chat-size screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-beauty-chat-preview
          path: |
            /tmp/beauty-chat-reply-visible.png
            /tmp/final-beauty-desktop.png
            /tmp/final-beauty-mobile.png
          if-no-files-found: ignore
