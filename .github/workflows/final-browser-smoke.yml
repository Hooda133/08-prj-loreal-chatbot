name: Final pre-submission browser smoke test

on:
  pull_request:
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "tests/browser-smoke.mjs"
      - ".github/workflows/final-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install temporary Chrome automation dependency
        run: npm install --no-save --no-package-lock puppeteer-core

      - name: Start website preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/final-preview.log 2>&1 &
          sleep 2

      - name: Test real browser behavior at desktop and phone widths
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "Chrome is not installed on this runner"
            exit 1
          fi
          CHROME_PATH="$CHROME" node tests/browser-smoke.mjs

      - name: Upload desktop and mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-beauty-browser-preview
          path: |
            /tmp/final-beauty-desktop.png
            /tmp/final-beauty-mobile.png
          if-no-files-found: ignore
